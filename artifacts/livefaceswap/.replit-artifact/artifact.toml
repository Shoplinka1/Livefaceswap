kind = "web"
previewPath = "/"
title = "LiveFaceSwap"
version = "1.0.0"
id = "artifacts/livefaceswap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20082

[services.development]
run = "pnpm --filter @workspace/livefaceswap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/livefaceswap", "run", "build" ]
serve = "static"
publicDir = "artifacts/livefaceswap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20082"
BASE_PATH = "/"
